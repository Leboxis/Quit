name: Quit
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Quit:
    type: application
    platform: iOS
    sources:
      - path: Quit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leboxis.quit
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Quit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSFaceIDUsageDescription: Déverrouiller ton espace personnel Quit.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - sdk: MessageUI.framework
  QuitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuitTests]
    dependencies:
      - target: Quit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leboxis.quit.tests
        GENERATE_INFOPLIST_FILE: YES
  QuitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QuitUITests]
    dependencies:
      - target: Quit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leboxis.quit.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Quit:
    build:
      targets:
        Quit: all
        QuitTests: [test]
        QuitUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - QuitTests
        - QuitUITests
