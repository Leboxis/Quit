name: Build and release unsigned Quit IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quit-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks and compilation start together: no simulator on the release path.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts and original learning content
        run: |
          python3 -m compileall -q scripts tests
          python3 scripts/validate_resources.py
          python3 -m unittest discover -s tests -v

  build:
    runs-on: macos-26
    # Reserve the remaining minute for publication. A timeout is a failure.
    timeout-minutes: 4
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest available Xcode (prefer 27)
        run: python3 scripts/select_xcode.py
      - name: Ensure XcodeGen is available
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Set a monotonically increasing app version
        id: version
        run: echo "version=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned arm64 application for iPhone/iPad
        env:
          QUIT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          xcodebuild build -project Quit.xcodeproj -scheme Quit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' MARKETING_VERSION="$QUIT_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build-device.log
      - name: Verify and package unsigned IPA
        run: |
          APP='build/Device/Build/Products/Release-iphoneos/Quit.app'
          lipo "$APP/Quit" -verify_arch arm64
          if codesign -dv "$APP" 2>/dev/null; then
            echo 'Unexpected application signature'; exit 1
          fi
          python3 scripts/distribution.py pack --app "$APP" --output build/Quit.ipa
      - name: Build source and checksum from compiled Info.plist
        env:
          QUIT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/distribution.py source --ipa build/Quit.ipa --repository "$GITHUB_REPOSITORY" \
            --tag "v$QUIT_VERSION" --date "$(date -u +%F)" --output build/source.json
      - uses: actions/upload-artifact@v4
        with:
          name: quit-unsigned-${{ github.sha }}
          compression-level: 0
          path: |
            build/Quit.ipa
            build/source.json
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Preserve compiler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quit-build-log-${{ github.run_number }}
          path: build-device.log
          if-no-files-found: ignore

  publish:
    needs: [checks, build]
    # Only a push publishes; checks and the device build must both succeed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QUIT_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quit-unsigned-${{ github.sha }}
          path: build
      - name: Publish immutable per-push release
        run: |
          TAG="v$QUIT_VERSION"
          cat > build/release-notes.md <<EOF
          Quit $QUIT_VERSION · build automatique du commit $GITHUB_SHA.

          IPA arm64 non signé pour SideStore ou LiveContainer. iOS 18 minimum.
          V2.1 en cours de validation : commandes adaptées aux grandes polices et temps SOS recalculé au retour.
          Demandes Face ID annulées en arrière-plan ; état des autorisations et de la programmation des rappels affiché.
          Ambiances Sauge, Brume et Sable, mode clair/sombre et réglages de confort.
          Données et sauvegardes V1/V2 conservées. Check-in, journal, 42 exercices et progrès privés.
          Les essais sur appareils SideStore et LiveContainer restent nécessaires pour valider V2.1.
          Aucun certificat, profil de provisioning ni extension Screen Time inclus.

          Source de mises à jour : https://raw.githubusercontent.com/$GITHUB_REPOSITORY/catalog/source.json
          La signature ou la préparation nécessaire est effectuée par votre outil d'installation.
          Quit ne remplace pas un accompagnement professionnel.
          EOF
          publish_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" build/Quit.ipa build/source.json build/SHA256SUMS.txt --clobber
            else
              gh release create "$TAG" build/Quit.ipa build/source.json build/SHA256SUMS.txt \
                --target "$GITHUB_SHA" --title "Quit $QUIT_VERSION" --notes-file build/release-notes.md --latest=false
            fi
          }
          # GitHub answers a transient "HTTP 403: Resource not accessible by integration" on the
          # releases API for a short while after a push; retry with backoff instead of going red.
          for attempt in 1 2 3; do
            if publish_release; then
              echo "Release $TAG published on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            delay=$((attempt * 5))
            echo "::warning::Release publish attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "::error::Unable to publish release $TAG after 3 attempts."
          exit 1
      - name: Update SideStore/LiveContainer catalog without triggering main
        run: python3 scripts/publish_catalog.py
